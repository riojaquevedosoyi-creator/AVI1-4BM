<main class="container mt-5">

    <h1 id="titulo">Verificador de idade</h1>

    <div class="mb-3">
        <label for="nome" class="form-label">
            Nome:
        </label>

        <input
            type="text"
            id="nome"
            class="form-control"
        >
    </div>

    <div class="mb-3">
        <label for="idade" class="form-label">
            Idade:
        </label>

        <input
            type="number"
            id="idade"
            class="form-control"
        >
    </div>

    <button
        id="botao"
        class="btn btn-primary"
    >
        Verificar
    </button>

    <p id="resultado" class="mt-3"></p>

</main>
